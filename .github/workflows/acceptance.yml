name: Game acceptance
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      extended:
        description: Run impairment profiles and a 30-minute 32-client Windows soak
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  functional:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Native import, unit, negative gates, dense transport, mixed matrix and memory
        run: python tools/ci-acceptance.py
      - name: Keep evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-${{ matrix.os }}
          include-hidden-files: true
          path: |
            .tools/ci-acceptance/
            .tools/dense-replication/
            .tools/architecture-matrix/
  extended:
    if: github.event_name == 'workflow_dispatch' && inputs.extended
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify engine and export templates
        shell: pwsh
        run: ./tools/bootstrap.ps1
      - name: Impairment and retransmission matrix
        run: python tools/verify-network-impairment.py --profile all
      - name: Dense fan-out under loss, jitter and per-client congestion
        run: python tools/verify-dense-replication.py --profile all
      - name: Repeated match teardown and audio preparation
        shell: pwsh
        run: |
          . ./tools/common.ps1
          $godot = Get-SsfGodotExecutable
          $text = (& $godot --headless --path . --log-file .tools/lifecycle.engine.log --script res://src/test/architecture_memory_verifier.gd -- --cycles=1000 2>&1 | Out-String)
          $text | Set-Content .tools/lifecycle.log
          Assert-SsfGodotResult -Output $text -ExitCode $LASTEXITCODE -Name 'Extended lifecycle' -ExpectedPattern 'SSF_ARCHITECTURE_MEMORY=.*"valid":true'
      - name: Fresh Windows packages, interoperability and long server soak
        shell: pwsh
        run: ./tools/verify-windows-packages.ps1 -SoakSeconds 1800
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extended-acceptance
          include-hidden-files: true
          path: |
            .tools/network-impairment/
            .tools/dense-replication/
            .tools/soak-verification/
            .tools/package-acceptance/
            .tools/package-interop/
            .tools/lifecycle*
